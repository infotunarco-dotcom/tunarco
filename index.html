<style>
:root{
  --navy:#1f4e79; --navy-d:#163a5c; --blue:#2e8fc0; --blue-l:#e6f3fa;
  --purple:#7b3f86; --purple-l:#f3eaf5; --green:#1a8a45; --green-l:#e4f4ea;
  --orange:#f39200; --orange-d:#d77f00; --orange-l:#fff1dc;
  --ink:#1d2b36; --mut:#64748b; --line:#e2e8f0; --bg:#f3f6f9; --card:#fff;
  --bad:#d64545; --bad-l:#fde8e8;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit}
a{color:var(--blue)}
/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#1f4e79 0%,#2e8fc0 55%,#7b3f86 100%)}
.login-card{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.login-card .lg{display:block;width:100%;max-width:300px;margin:0 auto 6px}
.login-card h1{font-size:14px;color:var(--mut);font-weight:500;margin:4px 0 20px;text-align:center}
.demo-acc{margin-top:16px;background:var(--blue-l);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.7}
.demo-acc code{background:#fff;padding:1px 5px;border-radius:4px}
/* ---------- Layout ---------- */
#app{display:none;min-height:100vh}
.side{position:sticky;top:0;z-index:30;background:#fff;box-shadow:0 2px 14px rgba(15,40,70,.10)}
.tb1{display:flex;align-items:center;gap:14px;padding:8px 22px;max-width:1600px;margin:0 auto;height:60px}
.side .brand{height:44px;flex-shrink:0}
.side .brand img{height:44px;width:auto;display:block}
.side .brand small{display:none}
.ansel{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--blue-l);border-radius:20px;font-size:12px;font-weight:600;color:var(--navy)}.ansel select{border:0;background:transparent;font-weight:800;color:var(--navy);padding:2px 0;cursor:pointer}
.tb1 .sp{flex:1}
.side .who{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--mut)}
.side .who .id{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.side .who b{color:var(--ink);font-size:13.5px}
.side .who .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.side .who .links{display:flex;gap:6px;align-items:center}
.side .who .links a{cursor:pointer;font-weight:600;text-decoration:none;padding:6px 10px;border-radius:8px;background:var(--bg);color:var(--ink);font-size:12.5px;white-space:nowrap}
.side .who .links a:hover{background:var(--blue-l)}
.side .who .links a.out{color:var(--bad);background:var(--bad-l)}
#syncbadge:empty{display:none}
.side nav{background:linear-gradient(90deg,var(--navy-d),var(--navy) 55%,#2a5d8f);display:flex;gap:0;padding:0 10px;justify-content:safe center;overflow-x:auto;scrollbar-width:thin}
.side nav a{display:flex;align-items:center;gap:6px;padding:11px 9px;color:rgba(255,255,255,.82);text-decoration:none;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;border-bottom:3px solid transparent}
.side nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.side nav a.on{color:#fff;border-bottom-color:var(--orange);background:rgba(255,255,255,.12)}
.side nav a.mob{display:none}
.burger2{display:none;border:0;background:var(--navy);color:#fff;border-radius:9px;font-size:20px;padding:4px 11px;cursor:pointer}
.main{min-width:0;max-width:1600px;margin:0 auto}
.head{color:var(--ink);padding:18px 26px 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:22px;color:var(--navy);font-weight:800}
.head .sp{flex:1}
.head .meta{font-size:12.5px;color:var(--mut);background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:20px}
.head .meta:empty{display:none}
.head .hb{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600}
.head .hb:hover{background:var(--blue-l)}
.head .burger{display:none}
.content{padding:20px 26px 60px;max-width:1500px}
.sub{color:var(--mut);margin:0 0 16px}
/* ---------- UI ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-left:5px solid var(--navy)}
.kpi.b{border-left-color:var(--blue)}.kpi.g{border-left-color:var(--green)}.kpi.p{border-left-color:var(--purple)}.kpi.o{border-left-color:var(--orange)}
.kpi .l{color:var(--mut);font-size:12.5px}
.kpi .v{font-size:25px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.two{grid-template-columns:1fr 1fr}.split{grid-template-columns:2fr 1fr;align-items:start}
.btn{border:0;border-radius:9px;padding:8px 14px;cursor:pointer;background:var(--navy);color:#fff;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{background:var(--navy-d)}
.btn.o{background:var(--orange)}.btn.o:hover{background:var(--orange-d)}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.g:hover{background:var(--bg)}
.btn.r{background:var(--bad-l);color:var(--bad)}.btn.r:hover{background:#f9d2d2}
.btn.gr{background:var(--green)}.btn.gr:hover{background:#13703a}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.wide{width:100%;padding:11px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);min-width:0}

const attenduCol0 = (e,t,col) => col==='insc' ? inscOf(e) : /^m\d$/.test(col) ? tarifOf(e) : col==='comp' ? ((isCompetiteur(e)||+e.prixComp) ? (+e.prixComp||100) : 0) : 0;

function situation(e,t){

  let echu = 0; const T=TRIMS[t];

  MOIS_START[t].forEach((m,i)=>{ if(TODAY > addDays(m,9)) echu += attenduCol(e,t,'m'+(i+1)); });
  echu = Math.min(echu, du);
  const retard = Math.max(0, echu-paye);
  const statut = du<=0 ? 'Tarif ?' : paye>=du ? 'Réglé' : paye===0 ? 'Non payé' : 'Partiel';
  return {paye, comp, du, reste, retard, statut};
}

function caisseTable(t){
  const auto=recettesAuto('academie',t), manIn=S.caisse.filter(c=>c.compte==='academie'&&c.sens==='in'&&inT(c.date,t,'academie')), manOut=S.caisse.filter(c=>c.compte==='academie'&&c.sens==='out'&&inT(c.date,t,'academie')).sort((a,b)=>a.date.localeCompare(b.date));
  const rec=[], bold=[0,1,2];
  [['Abonnements (mois)',x=>['m1','m2','m3'].includes(x.col)],["Frais d'inscription",x=>x.col==='insc'],['Compétiteurs (à part)',x=>x.col==='comp']].forEach(([lib,f])=>{ const L=auto.filter(f); if(!L.length) return; const g={}; L.forEach(x=>{ g[x.date]=g[x.date]||{m:0,n:0}; g[x.date].m+=x.montant; g[x.date].n++; });
    rec.push({h:lib}); Object.keys(g).sort().forEach(d=>rec.push([fmtD(d),lib.replace(' (à part)','')+' ('+g[d].n+' paiement'+(g[d].n>1?'s':'')+')',g[d].m,''])); rec.push({st:'Sous-total '+lib, m:sum(L,x=>x.montant)}); });
  if(manIn.length){ rec.push({h:'Autres recettes'}); manIn.forEach(c=>rec.push([fmtD(c.date),c.libelle,+c.montant||0,c.rq||''])); }
  const n=Math.max(rec.length, manOut.length), rows=[['ÉTAT DE CAISSE '+(TRIMS[t]?.nom||t).toUpperCase()+' – '+anLabel()+' (mis à jour automatiquement par le site)'],['Recettes','','','','Dépenses'],['Date','Libellés','Montant','RQ','Date','Libellés','Montant','RQ']];
  for(let i=0;i<n;i++){ const r=rec[i], d=manOut[i]; let left=['','','',''];
    if(r){ if(r.h){ left=['',r.h,'','']; } else if(r.st){ left=['',r.st,r.m,'']; } else left=r; }
    rows.push([...left, ...(d?[fmtD(d.date),d.libelle,+d.montant||0,d.rq||'']:['','','',''])]); if(r&&(r.h||r.st)) bold.push(rows.length-1); }
  const rin=sum(auto,x=>x.montant)+sum(manIn,c=>+c.montant||0), rout=sum(manOut,c=>+c.montant||0);
  const ab=sum(auto.filter(x=>x.col!=='comp'),x=>x.montant)+sum(manIn,c=>+c.montant||0), cp=sum(auto.filter(x=>x.col==='comp'),x=>x.montant), vir=virAb(auto,manIn);
  rows.push(['','TT',rin,'','','TT',rout,'']); bold.push(rows.length-1); rows.push([]);
  [['Abonnements + inscriptions',ab],['− Virements (à la banque)',vir],['− Dépenses',rout],['= SOLDE CAISSE (sans compétiteurs ni virements)',ab-vir-rout],['Compétiteurs (à part, non compté)',cp]].forEach(([l,v])=>{ rows.push(['','','','','',l,Math.round(v*1000)/1000,'']); if(l.startsWith('=')) bold.push(rows.length-1); });
  return {rows, bold};
}
function achTables(){

  A.forEach(a=>{ const p=achCaisse(a), f=FOURS().find(x=>x.nom===a.four)||{}; ach.push([fmtD(a.date),(a.doc||'').split(' ')[0],a.num||'',a.four,f.tel||'',f.adr||'',a.usage||'',(a.items||[]).map(i=>(i.q||0)+' × '+(stk(i.sid)?.nom||i.nom||'?')).join(' ; '),+a.montant||0,p?'Oui':'Non',p?fmtD(p.date):'',p?(p.rq||''):'',a.note||'']); });
  ach.push(['','','','TOTAL','','','','',sum(A,a=>+a.montant||0),'Non payé : '+sum(A.filter(a=>!achCaisse(a)),a=>+a.montant||0)]);
  const four=[['FOURNISSEURS'],['Fournisseur','Téléphone','Adresse','Matricule fiscal','Remarque','Nb achats','Total acheté','Non payé']];
  fourNames().forEach(n=>{ const f=FOURS().find(x=>x.nom===n)||{}, L=A.filter(a=>a.four===n); four.push([n,f.tel||'',f.adr||'',f.mf||'',f.note||'',L.length,sum(L,a=>+a.montant||0),sum(L.filter(a=>!achCaisse(a)),a=>+a.montant||0)]); });
  const chg=[['CHARGES '+anLabel()+' (mois par mois)'],['Charge','Quand','Montant prévu',...chMoisList().map(m=>chLabel(m).toLowerCase())]], chgBold=[0,1];
  CHG().filter(c=>c.actif!==0).forEach(c=>chg.push([c.lib,c.freq==='T'?'Trimestre':'Mois',+c.montant||0,...chMoisList().map(m=>{ if(!chDue(c,m)) return ''; const p=chPaid(c,m); return p?'Payé '+p.montant+' le '+fmtD(p.date):'NON PAYÉ'; })]));
  const stkR=[['STOCK '+anLabel()+' (mis à jour automatiquement par le site)'],['Réf.','Article','Catégorie','Prix','Entrées','Sorties','Reste','Date d\'entrée','Fournisseur','Date de sortie','Payé ?']];
  S.stock.filter(x=>x.type!=='competition').forEach(x=>stkR.push([x.ref,x.nom,x.cat||'',x.prix||0,x.init||0,x.sortie||0,(x.init||0)-(x.sortie||0),stkLast(x,'in')?fmtD(stkLast(x,'in')):'',stkFour(x),stkLast(x,'out')?fmtD(stkLast(x,'out')):'',{oui:'Oui',non:'Non'}[stkPaye(x)]||'']));
  return {ach, four, chg, chgBold, stk:stkR};
}

function syncInit(){ SYNC.base = syncSnapshot(); }
function syncSetMsg(m){ SYNC.msg=m; const el=document.getElementById('syncinfo'); if(el) el.textContent=m; const s=document.getElementById('syncbadge'); if(s) s.textContent=m; }
function syncTick(){
  if(!S.session || !(CLOUD.url || (S.sync||{}).url)) return;
  if(!SYNC.base){ syncInit(); return; }
  const now = syncSnapshot(), ops=[];
  Object.keys(now).forEach(k=>{ if(JSON.stringify(now[k])!==JSON.stringify(SYNC.base[k])) ops.push(now[k]); });
  Object.keys(SYNC.base).forEach(k=>{ if(!now[k]){ const o={...SYNC.base[k]}; if(o.k==='table'||(o.k==='caisse'&&o.compte==='academie')) return; if(o.k==='pres') o.v=''; else if(o.k==='caisse') o.del=true; else ['insc','m1','m2','m3','comp'].forEach(c=>o[c]=0); ops.push(o); } });
  SYNC.base = now;
  if(ops.length){ SYNC.queue.push(...ops); syncFlush(); }
}
function syncFlush(){
  if(SYNC.busy || !SYNC.queue.length) return;
  const batch = SYNC.queue.splice(0, 300); SYNC.busy=true; syncSetMsg('⏳ Envoi de '+batch.length+' modification(s) vers Google Sheets…');
  fetch(CLOUD.url||S.sync.url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({annee:anLabel(), token:CLOUD.token, ops:batch})})
    .then(()=>{ SYNC.busy=false; syncSetMsg('✔ Synchronisé avec Google Sheets à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})); if(SYNC.queue.length) setTimeout(syncFlush,500); })
    .catch(()=>{ SYNC.busy=false; SYNC.queue.unshift(...batch); syncSetMsg('⚠ Pas de connexion – nouvel essai dans 30 s'); setTimeout(syncFlush,30000); });
}
function syncNow(){ if(!(CLOUD.url||(S.sync||{}).url)) return toast('Aucun serveur configuré');
  const snap=syncSnapshot(); SYNC.base=snap; SYNC.queue.push(...Object.values(snap)); syncFlush();
  const b=$('#lk-sync'); if(b){ b.innerHTML='⏳<span> Envoi…</span>'; const chk=setInterval(()=>{ if(!SYNC.busy&&!SYNC.queue.length){ clearInterval(chk); b.innerHTML='✔<span> Synchronisé</span>'; toast('✔ Fichiers Google Sheets à jour'); setTimeout(()=>b.innerHTML='🔄<span> Synchroniser</span>',4000); } },700); }
  toast('🔄 Envoi de '+Object.keys(snap).length+' lignes vers Google Sheets…'); }
function syncAll(){ if(!(CLOUD.url||(S.sync||{}).url)) return toast('Aucun serveur configuré'); if(!confirm('Envoyer toutes les présences et tous les paiements vers Google Sheets ?')) return; const snap=syncSnapshot(); SYNC.base=snap; SYNC.queue.push(...Object.values(snap)); syncFlush(); toast(Object.keys(snap).length+' lignes envoyées'); }

async function cloudLogin(id,pw){
  const info=$('#lg-cloud'); $('#lg-err').style.display='none'; info.textContent='☁️ Connexion au serveur…';

  if(r.needInit){ info.textContent=''; return cloudInitForm(id,pw); }

function cloudStart(r){
  CLOUD.token=r.token; CLOUD.ver=r.version; applyLoaded(r.data); S.niveaux=NIVEAUX;
  const u=S.users.find(x=>x.id===r.user.id)||r.user; $('#lg-cloud').textContent=''; $('#lg-init').style.display='none';
  SYNC.base=null; finishLogin(u); CLOUD.last=dataJSON(); cloudBadge('☁️ En ligne');
}
function cloudInitForm(id,pw){
  const b=$('#lg-init'); b.style.display='block';
  b.innerHTML=`<div class="alert info small" style="display:block;margin-top:10px">☁️ <b>Le serveur en ligne est vide.</b><br>Choisissez votre fichier de sauvegarde <b>.json</b> (💾 Sauvegarder) et tapez le code d'initialisation pour y mettre vos données.</div>
    <input type="file" id="init-file" accept=".json" style="width:100%;margin:6px 0"><input id="init-code" placeholder="Code d'initialisation" style="width:100%;margin-bottom:6px">

  $('#init-go').onclick=()=>{ const f=$('#init-file').files[0]; if(!f) return alert('Choisissez le fichier .json'); const rd=new FileReader();
    rd.onload=async()=>{ let d; try{ d=JSON.parse(rd.result).data; }catch(e){ return alert('Fichier invalide'); }
      $('#lg-cloud').textContent='☁️ Envoi des données…';
      applyLoaded(d); applyPresSheet(); applyCleanup2(); applyPaySheet(); applyTarifs3(); applyPw1(); d=JSON.parse(dataJSON());
      try{ const r=await cloudCall({action:'init', code:$('#init-code').value.trim(), login:id, pass:pw, data:d}); if(r.error){ $('#lg-cloud').textContent=''; return alert(r.error); } cloudStart(r); toast('Données envoyées sur le serveur ✔'); }catch(e){ $('#lg-cloud').textContent='⚠ Erreur réseau'; } };
    rd.readAsText(f); };
}
async function cloudSave(){
  if(!CLOUD.url||!CLOUD.token||CLOUD.busy||!S.session) return; const j=dataJSON(); if(j===CLOUD.last) return;
  CLOUD.busy=true; cloudBadge('☁️ Enregistrement…');
  try{ const r=await cloudCall({action:'save', token:CLOUD.token, base:CLOUD.ver, data:JSON.parse(j)});
    if(r.error==='SESSION'){ cloudBadge('⚠ Session expirée'); alert('Votre connexion a expiré : reconnectez-vous.'); CLOUD.busy=false; return logout(); }
    if(r.error){ cloudBadge('⚠ '+r.error); }
    else if(r.conflict){ applyLoaded(r.data); CLOUD.ver=r.version; CLOUD.last=dataJSON(); render(); toast('⚠ Un autre utilisateur a modifié les données : votre dernière modification est peut-être à refaire.'); }
    else { CLOUD.ver=r.version; CLOUD.last=j; CLOUD.at=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); cloudBadge('☁️ Enregistré en ligne '+CLOUD.at); }
  }catch(e){ cloudBadge('⚠ Hors ligne – nouvel essai…'); }
  CLOUD.busy=false;
}

  if(!CLOUD.token||CLOUD.busy||!S.session) return; if(dataJSON()!==CLOUD.last) return; if(document.getElementById('ov')?.classList.contains('show')) return;
  try{ const r=await cloudCall({action:'get', token:CLOUD.token, since:CLOUD.ver}); if(r.error==='SESSION') return logout();
    if(r.data){ const y=window.scrollY; applyLoaded(r.data); CLOUD.ver=r.version; CLOUD.last=dataJSON(); render(); window.scrollTo(0,y); } }catch(e){}
}

const LS_KEY='tunarco_gestion_data', LS_BK='tunarco_gestion_bk_';
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } };

function applyLoaded(o){ Object.assign(S,o); applyListes(); S.annee=+(S.annee||2026); S.years=S.years||{}; setYearDates(S.annee);
  if(Array.isArray(S.niveaux)) NIVEAUX.splice(0,NIVEAUX.length,...S.niveaux); S.niveaux=NIVEAUX; }
let AUTO={last:'', ok:null, at:''};
(function(){ const raw=lsGet(LS_KEY); if(!raw) return; try{ const o=JSON.parse(raw); applyLoaded(o); AUTO.last=raw; AUTO.ok=true; AUTO.restored=true; }catch(e){} })();
function autoSave(){
  if(!S.session) return; const j=dataJSON(); if(j===AUTO.last) return;
  AUTO.ok=lsSet(LS_KEY,j); AUTO.last=j; AUTO.at=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  if(AUTO.ok){ lsSet(LS_BK+TODAY,j); try{ Object.keys(localStorage).filter(k=>k.startsWith(LS_BK)).sort().slice(0,-10).forEach(k=>localStorage.removeItem(k)); }catch(e){} }
  const el=document.getElementById('autobadge'); if(el && !CLOUD.token) el.textContent = AUTO.ok?('💾 Enregistré '+AUTO.at):'⚠ Sauvegarde auto impossible';
}

function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader(); r.onload = () => { try{ const o=JSON.parse(r.result).data; const sess=S.session; applyLoaded(o); anSelFill(); S.session=S.users.find(u=>u.id===sess.id)||sess; if(!o.sheetSync) delete S.sheetSync; const rr=applyPresSheet(); applyCleanup2(); applyPaySheet(); applyTarifs3(); applyPw1(); if(rr) setTimeout(()=>alert('Feuille Présence reprise : '+rr.maj+' élèves mis à jour, '+rr.nouveaux.length+' nouveaux, '+rr.retires.length+' élèves absents de la feuille supprimés.'),300); SYNC.base=null; render(); AUTO.last=''; autoSave(); toast('Sauvegarde chargée ✔'+((S.sync||{}).url?' – utilisez « Tout envoyer » dans Paramètres pour mettre à jour Google Sheets':'')); }catch(e){ alert('Fichier invalide'); } inp.value=''; };
  r.readAsText(f);
}

function openModal(html, lg){ const m=$('#modal'); m.className='modal'+(lg?' lg':''); m.innerHTML=html; $('#ov').classList.add('show'); setTimeout(()=>{const i=m.querySelector('input:not([type=hidden]),select');},0); }
function closeModal(){ $('#ov').classList.remove('show'); }
const mHead = t => `<h3>${t}<button class="x" onclick="closeModal()">×</button></h3>`;
let _formSave = null;
function formModal(title, fields, vals, onSave, extraBtn){
  _formSave = onSave;
  const inp = f => {
    const v = vals[f.k] ?? f.def ?? '';
    if(f.type==='select') return `<select name="${f.k}">${f.options.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o]; return `<option value="${h(ov)}" ${String(ov)===String(v)?'selected':''}>${h(ol)}</option>`;}).join('')}</select>`;
    if(f.type==='textarea') return `<textarea name="${f.k}" rows="2">${h(v)}</textarea>`;
    return `<input name="${f.k}" type="${f.type||'text'}" value="${h(v)}" ${f.req?'required':''} ${f.type==='number'?'step="any" min="0"':''} ${f.ph?`placeholder="${h(f.ph)}"`:''}>`;
  };
  openModal(mHead(title) + `<div id="mform" class="form" onkeydown="if(event.key==='Enter'&&event.target.tagName==='INPUT')submitForm()">
    ${fields.map(f=> f.sec ? `<div class="sec">${h(f.sec)}</div>` : `<label class="${f.full?'full':''} ${f.cls||''}">${h(f.label)}${inp(f)}</label>`).join('')}
    <div class="mfoot" style="grid-column:1/-1">${extraBtn||''}<button type="button" class="btn g" onclick="closeModal()">Annuler</button><button type="button" class="btn" onclick="submitForm()">Enregistrer</button></div>
  </div>`);
}
function submitForm(){
  const fd = {}; let miss = null;
  document.querySelectorAll('#mform [name]').forEach(el=>{ fd[el.name]=el.value; if(el.required && !String(el.value).trim() && !miss) miss=el; });
  if(miss){ miss.focus(); toast('Champ obligatoire manquant'); return; }
  const r = _formSave(fd); if(r===false) return;
  if(r!=='keep') closeModal(); render(); toast('Enregistré ✔');
}
function del(coll, id, label, after){
  if(!isAdmin()) return toast('Action réservée à l\'administrateur');
  if(!confirm(`Supprimer ${label} ?`)) return;
  S[coll] = S[coll].filter(x=>x.id!==id); if(after) after(id); closeModal(); render(); toast('Supprimé');
}

    <div class="kpi o"><div class="l">Reste à encaisser ${t}</div><div class="v">${dt(att-enc>0?att-enc:0)}</div><div class="s">${nonPayes.length} élève(s) sans aucun paiement</div></div>
    <div class="kpi b"><div class="l">Solde de la caisse</div><div class="v" style="color:${sc.solde<0?'var(--bad)':'var(--green)'}">${dt(sc.solde)}</div><div class="s">Ce mois : +${dt(encMois)} / −${dt(depMois)}</div></div>
    <div class="kpi p"><div class="l">Taux de présence du jour</div><div class="v">${tp===null?'—':tp+' %'}</div><div class="s">${tpL}</div></div>
  </div>
  <div class="card"><h3>🎯 Objectif d'encaissement – ${T.nom} (mensualités, hors inscription, compétiteurs et projets)</h3>
    <div style="display:flex;align-items:center;gap:12px"><div class="bar" style="flex:1;height:14px;position:relative"><i style="width:${Math.min(100,abo/S.objectif.max*100)}%;background:${abo>=S.objectif.min?'var(--green)':'var(--blue)'}"></i></div><b>${dt(abo)}</b></div>
    <div class="small muted" style="margin-top:6px">Minimum ${dt(S.objectif.min)} · Maximum ${dt(S.objectif.max)} — modifiable dans Paramètres</div></div>
  <div class="grid two">
    <div class="card"><h3>🔔 Alertes</h3>
      ${(()=>{ const ch=chequesAVenir(); return ch.length?`<div class="alert info"><b>🏦 ${ch.length} chèque(s) à encaisser</b><span class="sp"></span><button class="btn sm" onclick="chequesModal()">Voir</button></div>`:''; })()}
      ${retards.length?`<div class="alert bad"><b>${retards.length} retard(s) de paiement</b><span class="sp"></span><button class="btn sm" onclick="F_PAY.statut='Retard';go('paiements')">Voir</button></div>`:''}

      ${bas.map(s=>`<div class="alert warn small">📦 Stock faible : <b>${h(s.nom)}</b><span class="sp"></span>${s.qte-s.panne} dispo (seuil ${s.seuil})</div>`).join('')}
      ${comps.map(c=>`<div class="alert info small">🏆 <b>${h(c.nom)}</b> dans ${Math.round((new Date(c.date)-new Date(TODAY))/864e5)} jours · ${h(c.lieu)}</div>`).join('')}

};

  if(!F_PAY.tab) F_PAY.tab = curTrim();
  const tabs = `<div class="tabs">${['T1','T2','T3'].map(t=>`<button class="${F_PAY.tab===t?'on':''}" onclick="F_PAY.tab='${t}';render()">PAIEMENT ${t}</button>`).join('')}<button class="${F_PAY.tab==='projet'?'on':''}" onclick="F_PAY.tab='projet';render()">PAIEMENT Projet 1+2</button><button class="${F_PAY.tab==='compet'?'on':''}" onclick="F_PAY.tab='compet';render()">🏆 PAIEMENT Compétitions</button><button class="${F_PAY.tab==='mc'?'on':''}" onclick="F_PAY.tab='mc';render()">🎓 PAIEMENT Master class</button></div>`;
  return tabs + (F_PAY.tab==='projet' ? payProjet() : F_PAY.tab==='compet' ? payCompet() : F_PAY.tab==='mc' ? payMC() : payTrim(F_PAY.tab));

function filtres(){
  return `<div class="toolbar">
    <input placeholder="🔍 Rechercher un élève…" value="${h(F_PAY.q)}" onchange="F_PAY.q=this.value;render()" style="min-width:200px">
    <select onchange="F_PAY.jour=this.value;render()"><option value="">Tous les jours</option>${JOURS.filter(j=>S.eleves.some(e=>e.jour===j)).map(j=>`<option ${F_PAY.jour===j?'selected':''}>${j}</option>`).join('')}</select>
    ${F_PAY.tab!=='projet'?`<select onchange="F_PAY.statut=this.value;render()">${[['','Tous les statuts'],['Réglé','Réglé'],['Partiel','Partiel'],['Non payé','Non payé'],['Retard','En retard']].map(([v,l])=>`<option value="${v}" ${F_PAY.statut===v?'selected':''}>${l}</option>`).join('')}</select>`:''}
    <span class="sp"></span><button class="btn g" onclick="editEleve()">+ Ajouter un élève</button><button class="btn o" onclick="payModal()">+ Enregistrer un paiement</button></div>`;
}
const elevesFiltres = () => S.eleves.filter(e=>e.statut!=='Abandon' && e.statut!==ESSAI && e.statut!=='Externe' && (!F_PAY.jour||e.jour===F_PAY.jour) && e.nom.toLowerCase().includes(F_PAY.q.toLowerCase()));
function payTrim(t){
  const T = TRIMS[t], cols = colsOf(t);
  setHead('Paiements · '+T.nom, 'Cliquez sur une case pour enregistrer ou corriger un montant');
  let list = elevesFiltres().map(e=>({e, s:situation(e,t)}));
  if(F_PAY.statut) list = list.filter(x=>F_PAY.statut==='Retard' ? x.s.retard>0 : x.s.statut===F_PAY.statut);
  const all = S.eleves.filter(e=>e.statut!=='Abandon' && e.statut!==ESSAI && e.statut!=='Externe').map(e=>situation(e,t));
  const days = JOURS.filter(j=>list.some(x=>x.e.jour===j));
  let rows = '';
  days.forEach(j=>{
    const L = list.filter(x=>x.e.jour===j);
    L.forEach((x,i)=>{ const e=x.e, s=x.s;
      rows += `<tr>${i===0?`<td class="day" rowspan="${L.length}" style="background:${DAYCOL[j]}">${j.toUpperCase()}</td>`:''}
        <td class="idx">${i+1}</td>
        <td class="nm" onclick="ficheEleve('${e.id}')">${h(e.nom)}${e.statut==='En pause'?' '+badge('pause','b-warn'):''}</td>
        ${cols.map(([c])=>{ const v=cellSum(e.id,t,c), a=attenduCol(e,t,c); const cls = !v?'':c==='comp'?'comp':(v>=a?'full':'part');
          return `<td><span class="cell ${cls}" onclick="payGrid('${e.id}','${t}','${c}')">${v?dt(v):'—'}</span></td>`; }).join('')}
        <td class="tt">${dt(s.paye)}</td>
        <td class="tt">${s.du<=0?badge('Tarif ?','b-mut'):s.reste>0?badge(dt(s.reste), s.retard>0?'b-bad':'b-warn'):badge('Réglé','b-ok')}</td>
        <td><select onchange="setF('${e.id}','mode',this.value)"><option value="">—</option>${MODES.map(m=>`<option ${e.mode===m?'selected':''}>${m}</option>`).join('')}</select></td>
        <td><input class="rq" value="${h(e.rq)}" placeholder="—" onchange="setF('${e.id}','rq',this.value)"></td>
        <td><select onchange="setF('${e.id}','type',this.value)"><option value="">—</option>${TYPES.map(m=>`<option ${e.type===m?'selected':''}>${m}</option>`).join('')}</select></td>
        <td style="white-space:nowrap"><button class="btn sm o" onclick="payGrid('${e.id}')">Payer</button>
          ${s.retard>0||s.reste>0?`<a class="btn sm g" title="Rappel WhatsApp" target="_blank" rel="noopener" href="${waLink(e.tel1, `Bonjour, ici l'académie Les Petits Génies (Tunarco). Petit rappel : il reste ${dt(s.reste)} à régler pour ${e.nom} (${T.nom}). Merci beaucoup !`)}">💬</a>`:''}
          <button class="btn sm g" onclick="editEleve('${e.id}')">Modifier</button></td></tr>`;
    });
  });
  const totCol = c => sum(list, x=>cellSum(x.e.id,t,c));
  const nType = ty => list.filter(x=>x.e.type===ty).length;
  return `
  <div class="grid kpis">
    <div class="kpi"><div class="l">Attendu (${t})</div><div class="v">${dt(sum(all,s=>s.du))}</div><div class="s">${all.length} élèves</div></div>
    <div class="kpi g"><div class="l">Encaissé</div><div class="v">${dt(sum(all,s=>s.paye))}</div><div class="s">+ ${dt(sum(all,s=>s.comp))} compétiteurs</div></div>
    <div class="kpi o"><div class="l">Reste à payer</div><div class="v">${dt(sum(all,s=>s.reste))}</div><div class="s">${all.filter(s=>s.statut==='Non payé').length} non payé · ${all.filter(s=>s.statut==='Partiel').length} partiel</div></div>
    <div class="kpi" style="border-left-color:var(--bad)"><div class="l">En retard (échéance le 10)</div><div class="v" style="color:var(--bad)">${dt(sum(all,s=>s.retard))}</div><div class="s">${all.filter(s=>s.retard>0).length} élève(s)</div></div>
  </div>
  ${filtres()}
  <div class="card tw" style="padding:0;max-height:75vh;overflow:auto"><table class="ptable">
    <thead><tr><th>JR</th><th>N°</th><th style="text-align:left">Nom et Prénom</th>${cols.map(([,l])=>`<th>${l}</th>`).join('')}<th>Total payé</th><th>Reste à payer</th><th>Mode de paiement</th><th>Rq</th><th>Type de paiement</th><th></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="${cols.length+9}" class="empty">Aucun élève.</td></tr>`}
    <tr class="tot"><td></td><td></td><td>TT</td>${cols.map(([c])=>`<td class="tt" style="text-align:center">${dt(totCol(c))}</td>`).join('')}
      <td class="tt">${dt(sum(list,x=>x.s.paye))}</td><td class="tt">${dt(sum(list,x=>x.s.reste))}</td><td colspan="4" class="small">Comptant : ${nType('Comptant')} · Mensuel : ${nType('Mensuel')}</td></tr></tbody>

}

  setHead('Paiements · Projet 1+2', 'Prix selon le niveau : modifiable dans Paramètres');

  const days = JOURS.filter(j=>list.some(e=>e.jour===j));

      <td><select onchange="setF('${e.id}','niveau',this.value)"><option value="À préciser">À préciser</option>${NIVEAUX.map(n=>`<option ${e.niveau===n?'selected':''}>${n}</option>`).join('')}</select></td>

    <div class="card"><h3>Résumé par niveau</h3><table><tr><th>Niveau</th><th class="num">Élèves</th><th class="num">Total payé</th></tr>

function payCompet(){
  setHead('Paiements · Compétitions', 'Frais payés par les parents pour chaque compétition');
  const list = [...S.competitions].sort((a,b)=>a.date.localeCompare(b.date));
  return `<div class="toolbar"><span class="small muted">Cliquez sur une case « Payé » pour enregistrer un versement.</span><span class="sp"></span><button class="btn g" onclick="go('competitions')">Gérer les compétitions</button><button class="btn o" onclick="editComp()">+ Nouvelle compétition</button></div>
  ${list.map(c=>{ const parts=compParts(c); const enc=sum(parts,id=>compPaye(c.id,id)); const dep=sum(S.caisse.filter(x=>x.refComp===c.id),x=>x.montant);
    return `<div class="card comp-card"><div class="toolbar" style="margin-bottom:8px"><div><h3 style="margin:0">🏆 ${h(c.nom)}</h3><div class="small muted">${fmtD(c.date)} · ${h(c.lieu)} · ${dt(c.frais)} / élève</div></div><span class="sp"></span>

function setPrevu(eid,t,c,v){ const e=elv(eid); e.prevu=e.prevu||{}; e.prevu[t]=e.prevu[t]||{}; if(v===''||v===null) delete e.prevu[t][c]; else e.prevu[t][c]=+v||0; render(); payGrid(eid,t); toast('Prévu modifié ✔'); }
function applyRemise(eid,v){ const e=elv(eid), r=+v||0; if(!r) return; e.prevu=e.prevu||{}; ['T1','T2','T3'].forEach(t=>{ e.prevu[t]=e.prevu[t]||{}; ['m1','m2','m3'].forEach(c=>e.prevu[t][c]=Math.max(0,tarifOf(e)-r)); }); e.remise=r; render(); payGrid(eid, F_PAY.tab&&TRIMS[F_PAY.tab]?F_PAY.tab:'T1'); toast('Remise de '+r+' DT/mois appliquée ✔'); }
function setPaid(eid,t,c,v){ v=+v||0; const L=S.tx.filter(x=>x.eleve===eid && x.trim===t && x.col===c).sort((a,b)=>a.date.localeCompare(b.date));
  const cur=sum(L,x=>x.montant); if(v===cur) return;
  if(!v){ if(!confirm('Effacer tous les versements de cette case ?')) return payGrid(eid,t); S.tx=S.tx.filter(x=>!L.includes(x)); }
  else if(L.length){ L[0].montant=v; L[0].lot=undefined; S.tx=S.tx.filter(x=>!L.slice(1).includes(x)); }
  else S.tx.push({id:uid('t'), eleve:eid, trim:t, col:c, montant:v, date:TODAY, mode:elv(eid).mode||'Espèces', note:'Correction'});
  render(); payGrid(eid,t); toast('Montant corrigé ✔'); }

function payModal(eid){
  const t = ['T1','T2','T3'].includes(F_PAY.tab) ? F_PAY.tab : F_PAY.tab==='compet' && S.competitions[0] ? S.competitions[0].id : curTrim();
  const e = eid ? elv(eid) : null;
  let col = 'insc';
  const cp = comp(t);
  if(cp) col='compet';
  else if(e){ const c = colsOf(t).map(x=>x[0]).filter(c=>c!=='comp').find(c=>cellSum(e.id,t,c) < attenduCol(e,t,c)); col = c || 'm1'; }
  else if(!TRIMS[t].insc) col='m1';
  const e0 = e || (cp && compParts(cp).length ? elv(compParts(cp)[0]) : S.eleves[0]);
  const def = cp ? (Math.max(0, cp.frais-compPaye(cp.id,e0.id)) || '') : e ? Math.max(0, attenduCol(e,t,col)-cellSum(e.id,t,col)) || '' : '';

    {k:'eleve',label:'Élève',type:'select',full:1,options:[...S.eleves].sort((a,b)=>a.nom.localeCompare(b.nom)).map(x=>[x.id,`${x.nom} – ${x.jour}`])},
    {k:'trim',label:'Période',type:'select',options:[['T1','Trimestre 1'],['T2','Trimestre 2'],['T3','Trimestre 3'],['projet','Projet 1+2'],...S.competitions.map(c=>[c.id,'🏆 '+c.nom])]},

    {k:'montant',label:'Montant (DT)',type:'number',req:1},
    {k:'date',label:'Date',type:'date',req:1},{k:'mode',label:'Mode de paiement',type:'select',options:MODES},
    ...CHQ_FIELDS,
    {k:'note',label:'Note',full:1},
  ], {eleve:e0.id, trim:t, col: TRIMS[t] && e ? 'auto' : col, montant: TRIMS[t] && e ? (sum(['m1','m2','m3'],c=>Math.max(0,attenduCol(e,t,c)-cellSum(e.id,t,c)))||'') : def, date:TODAY, mode:(e&&e.mode)||'Espèces'}, fd => {
    if(!(+fd.montant>0)){ toast('Montant invalide'); return false; }

      if(!TRIMS[fd.trim]){ toast('La répartition automatique concerne T1, T2 ou T3'); return false; }
      const ee=elv(fd.eleve), parts=repartir(ee, fd.trim, +fd.montant, fd.col), lot=uid('L');
      parts.forEach(([c,a])=>S.tx.push({id:uid('t'), ...fd, col:c, montant:a, lot}));
      if(!ee.mode) ee.mode=fd.mode;

  });

function stkMove(s, t, q, d, note, ach, four){ q=+q||0; if(!s||!q) return; s.mv=s.mv||[]; s.mv.push({id:uid('m'), t, q, d:d||TODAY, note:note||'', ach:ach||'', four:four||''});
  if(t==='in') s.init=(s.init||0)+q; else s.sortie=(s.sortie||0)+q; s.qte=Math.max(0,(s.init||0)-(s.sortie||0)); }

function stkPaye(s){ // état de paiement des entrées de cet article
  const ins=(s.mv||[]).filter(m=>m.t==='in'&&m.q>0); if(!ins.length) return '';
  let non=0, oui=0; ins.forEach(m=>{ if(m.ach){ const a=ACH().find(x=>x.id===m.ach); if(a) (achCaisse(a)?oui++:non++); } else if(m.paye==='oui') oui++; else if(m.paye==='non') non++; });
  return non?'non':oui?'oui':''; }

function stkMvSet(sid,mid,k,v){ const s=stk(sid), m=(s.mv||[]).find(x=>x.id===mid); if(!m) return;

function achSave(){

const TYPECOL = {'ÉLEC':'#2e6fbf','CAO':'#f39200','ATELIER':'#16a34a','PROJET':'#7b3f86'};
function classDates(jour){ const ck='cd'+jour; if(_C[ck]) return _C[ck]; let d=ANNEE.debut; while(jourOf(d)!==jour) d=addDays(d,1); const out=[]; while(d<=ANNEE.fin){ if(!ferieOf(d)) out.push(d); d=addDays(d,7);} return _C[ck]=out; }
/** séance du programme prévue à cette date pour ce niveau (le n-ième cours du groupe depuis le 1er octobre) */
function leconPrevue(niveau, jour, date){ const L=(S.programme||{})[niveau]; if(!L||!L.length) return null; const k=classDates(jour).indexOf(date); return k>=0&&k<L.length ? {n:k+1, ...L[k]} : null; }
/** parcours d'un élève : chaque séance du programme avec son statut */
function parcours(e){
  const L=(S.programme||{})[e.niveau]||[], g=grp(e.groupe), dates=g.jour?classDates(g.jour):[];
  return L.map((s,k)=>{ const d=dates[k]; const se=d?S.seances.find(x=>x.groupe===e.groupe&&x.date===d):null; const v=se?se.presences[e.id]:'';
    const r = v==='A' ? ratOf(e.groupe,e.id,d) : null;
    const st = v==='P'||v==='R' ? 'fait' : v==='A' ? (r&&r.fait?'rattrapee':r?'prevu':'rattraper') : (d && d<TODAY ? 'nonpointe' : 'avenir');
    return {n:k+1, ...s, date:d, st, rat:r}; });
}
function parcoursHtml(e){
  const L=parcours(e);
  if(!e.niveau || e.niveau==='À préciser') return '<div class="alert warn small">Choisissez d\'abord le niveau de l\'élève pour voir son programme.</div>';
  if(!L.length) return `<div class="alert info small">Pas encore de programme pour « ${h(e.niveau)} » (Planning → ajouter les séances).</div>`;
  const fait=L.filter(x=>x.st==='fait'||x.st==='rattrapee').length, ratt=L.filter(x=>x.st==='rattraper'||x.st==='prevu');
  const lab={fait:badge('✔ Suivie','b-ok'), rattraper:badge('✖ À rattraper','b-bad'), prevu:badge('📅 Rattrapage prévu','b-info'), rattrapee:badge('↺ Rattrapée','b-ok'), nonpointe:badge('Non pointée','b-warn'), avenir:'<span class="muted small">À venir</span>'};
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><b>${h(e.niveau)}</b><div class="bar" style="flex:1;height:10px"><i style="width:${fait/L.length*100}%;background:var(--green)"></i></div><b>${fait} / ${L.length} séances</b></div>
    ${ratt.length?`<div class="alert bad small">À rattraper : ${ratt.map(x=>'S'+x.n+' '+h(x.t)).join(' · ')}</div>`:''}
    <div class="tw" style="max-height:340px;overflow:auto"><table class="small"><tr><th>N°</th><th>Date</th><th>Séance</th><th>Statut</th></tr>
    ${L.map(x=>`<tr><td><b>S${x.n}</b></td><td>${x.date?fmtD(x.date):'—'}</td><td><span class="badge" style="background:${TYPECOL[x.type]}1a;color:${TYPECOL[x.type]}">${x.type}</span> ${h(x.t)}${x.sup?` <span class="muted">(${h(x.sup)})</span>`:''}</td><td>${lab[x.st]}</td></tr>`).join('')}</table></div>`;
}

  P.existing = s || null; P.lecon = s ? s.lecon : ''; P.notes = s ? s.notes : ''; P.pres = s ? {...s.presences} : {};

}

function saveSeance(){

          <td class="sel"><select onchange="setF('${e.id}','niveau',this.value||'À préciser')"><option value=""></option>${NIVEAUX.map(n=>`<option ${e.niveau===n?'selected':''}>${n}</option>`).join('')}</select></td>

      S.eleves.filter(e=>inG(e,g.id) && e.statut==='Abandon').forEach(e=>{
        rows += `<tr class="quitrow"><td class="idx">–</td><td class="nm2 st-quit" style="white-space:nowrap"><s>${h(e.nom)}</s> ${F_PT.edit||isAdmin()?`<button class="mini" title="Réintégrer dans le groupe" onclick="reintegrer('${e.id}')">↩</button>${F_PT.edit?`<button class="mini r" title="Supprimer définitivement" onclick="delEleveDef('${e.id}')">🗑</button>`:''}`:''}</td>

      });

      if(el.length) rows += `<tr class="sumr" data-g="${g.id}"><td></td><td>Présents / Absents</td><td colspan="3" class="small muted">${el.length} élève(s)</td>${dates.map(d=>{ if(ferieOf(d)) return '<td class="fer"></td>'; const s=seanceOf(g.id,d); const pr=s?el.filter(e=>['P','R'].includes(s.presences[e.id])).length:0, ab=s?el.filter(e=>s.presences[e.id]==='A').length:0;

      <tbody>${rows}</tbody></table></div></div>`;

};

function setPres(gid, eid, d, v, el){
  let s = S.seances.find(x=>x.groupe===gid && x.date===d);
  if(!s){ s={id:uid('s'), groupe:gid, date:d, lecon:'', notes:'', presences:{}, par:S.session.id}; S.seances.push(s); }
  if(v) s.presences[eid]=v; else delete s.presences[eid];
  if(!Object.keys(s.presences).length && !s.lecon) S.seances=S.seances.filter(x=>x!==s);
  P._k=''; _C.si=null;
  if(!el) return render();
  // mise à jour rapide de la case seulement (pas de rechargement de toute la page)
  const e=elv(eid), g=grp(gid), td=el.closest('td'), lp=leconPrevue(e.niveau,g.jour,d);
  const lt = lp ? 'S'+lp.n+' · '+h(lp.t) : (e.niveau&&e.niveau!=='À préciser' ? '—' : 'niveau ?');
  td.className = `pc ${v} ${d===TODAY?'today':''}`;
  td.querySelectorAll('.lec-ok,.lec-ko').forEach(x=>x.remove());
  td.querySelectorAll('.rat').forEach(x=>x.remove());
  if(v) td.insertAdjacentHTML('beforeend', v==='A'?`<div class="lec-ko">✖ ${lt}</div>${ratTag(gid,eid,d)}`:`<div class="lec-ok">${lt}</div>`);

  tr.querySelector('td.tot:not(.P):not(.A)').textContent = nP+nA ? Math.round(nP/(nP+nA)*100)+'%' : '—';
  const rowsG=[...document.querySelectorAll(`tr[data-g="${gid}"]:not(.sumr)`)], sr=document.querySelector(`tr.sumr[data-g="${gid}"]`);
  if(sr){ const col=rowsG.map(r=>r.querySelector(`td.pc[data-d="${d}"] select`)?.value||''); const pr=col.filter(x=>x==='P'||x==='R').length, ab=col.filter(x=>x==='A').length;
    const c=sr.querySelector(`td[data-d="${d}"]`); if(c) c.innerHTML = pr||ab ? `<b style="color:var(--green)">${pr}</b>/<b style="color:var(--bad)">${ab}</b>` : `<button class="allp" title="Tous présents" onclick="allP('${gid}','${d}')">✔P</button>`;
    const all=rowsG.flatMap(r=>[...r.querySelectorAll('td.pc select')].map(x=>x.value));
    sr.querySelector('td.tot.P').textContent=all.filter(x=>x==='P'||x==='R').length; sr.querySelector('td.tot.A').textContent=all.filter(x=>x==='A').length; }

function allP(gid, d){

function cyclePres(gid, eid, d){

let F_ST = 'tous', F_SQ = '';

function genRef(nom, exceptId){
  const words = (String(nom).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().match(/[A-Z0-9]+/g)||[]).filter(x=>x.length>=2);
  const pre = (words[0]||'ART').slice(0,3);
  const n = S.stock.filter(s=>s.id!==exceptId && String(s.ref||'').startsWith(pre+'-')).map(s=>+s.ref.split('-')[1]||0);
  return pre + '-' + String((n.length?Math.max(...n):0)+1).padStart(3,'0');
}
const stk = id => S.stock.find(s=>s.id===id);
const kitsOf = sid => S.kits.filter(k=>k.items.some(i=>i.sid===sid));
const besoinArticle = (sid, pj) => sum(S.kits.filter(k=>!pj||k.projet===pj), k=>sum(k.items.filter(i=>i.sid===sid), i=>i.q*(+k.eleves||0)));

function catOf(nom){
  const n = String(nom).toUpperCase();
  if(/MATRICE|AFFICHEUR|LCD|OLED/.test(n)) return 'Afficheurs';
  if(/ARDUINO|ESP32|MICRO:?BIT|RASPBERRY/.test(n)) return 'Cartes';
  if(/^LED|\bLED\b/.test(n)) return 'LED';
  if(/CAPTEUR|LDR|PHOTO|TCRT|CNY70|ULTRASON/.test(n) && !/SUPPORT/.test(n)) return 'Capteurs';
  if(/^R[ÉE]SISTANCE/.test(n)) return 'Résistances';
  if(/^FILS|^C[ÂA]BLE/.test(n)) return 'Fils & câblage';
  if(/BOUTON|INTERRUPTEUR|FIN DE COURSE|JOYSTICK|CLAVIER/.test(n)) return 'Boutons & interrupteurs';
  if(/BLUETOOTH|PONT H|DRIVER|L293|L298|MODULE/.test(n)) return 'Modules';
  if(/SERVO|MOTEUR/.test(n)) return 'Moteurs';
  if(/BUZZER/.test(n)) return 'Sons & buzzers';
  if(/CORDON|COUPLEUR|PILE|BATTERIE/.test(n)) return 'Alimentation';
  if(/CH[ÂA]SSIS|MDF|ALUCOBOND|PLAQUE|SUPPORT|POUBELLE/.test(n)) return 'Structure & châssis';
  if(/BO[IÎ]TE|OUTIL|FER À SOUDER/.test(n)) return 'Outils';
  return 'Autre';
}

function saveEquipe(cid, qi){

function editUser(id){
  const u = id ? S.users.find(x=>x.id===id) : {role:'formateur'};

    {k:'nom',label:'Nom complet',req:1},{k:'tel',label:'Téléphone'},

function goPerso(){ go('parametres'); setTimeout(()=>{ const el=document.getElementById('perso'); if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.style.boxShadow='0 0 0 3px var(--orange)'; setTimeout(()=>el.style.boxShadow='',1800); } },60); }
function lstAdd(k){ const v=(prompt('Nouvel élément pour « '+LISTES[k][0]+' » :')||'').trim(); if(!v) return; const a=LISTES[k][1]; if(a.includes(v)) return toast('Existe déjà'); a.push(v); saveListe(k); render(); toast('Ajouté ✔'); }
function lstRen(k,i,v){ v=v.trim(); const a=LISTES[k][1]; if(!v) return render(); a[i]=v; saveListe(k); toast('Renommé ✔'); }
function lstDel(k,i){ const a=LISTES[k][1]; if(a.length<=1) return toast('Gardez au moins un élément'); if(!confirm('Supprimer « '+a[i]+' » de la liste ?')) return; a.splice(i,1); saveListe(k); render(); }
function lstMv(k,i){ const a=LISTES[k][1]; if(!i) return; [a[i-1],a[i]]=[a[i],a[i-1]]; saveListe(k); render(); }
function cfAdd(){ const v=(prompt('Nom de la nouvelle colonne (ex : Taille T-shirt) :')||'').trim(); if(!v) return; if(CHAMPS().includes(v)) return toast('Existe déjà'); CHAMPS().push(v); render(); toast('Colonne ajoutée dans la page Élèves ✔'); }
function cfRen(i,v){ v=v.trim(); const old=CHAMPS()[i]; if(!v||v===old) return; S.eleves.forEach(e=>{ if(e.cf&&old in e.cf){ e.cf[v]=e.cf[old]; delete e.cf[old]; } }); CHAMPS()[i]=v; toast('Renommé ✔'); }
function cfDel(i){ const c=CHAMPS()[i]; if(!confirm('Supprimer la colonne « '+c+' » et son contenu ?')) return; S.eleves.forEach(e=>{ if(e.cf) delete e.cf[c]; }); CHAMPS().splice(i,1); render(); }
function mnSet(k,f,v){ S.menu=S.menu||{}; S.menu[k]=S.menu[k]||{}; S.menu[k][f]=v; go(VIEW); toast('Menu mis à jour ✔'); }
function renNiveau(i,v){ v=v.trim(); const old=NIVEAUX[i]; if(!v||v===old) return; if(NIVEAUX.includes(v)) return toast('Ce niveau existe déjà');
  NIVEAUX[i]=v; S.eleves.forEach(e=>{ if(e.niveau===old) e.niveau=v; }); S.groupes.forEach(g=>{ if(g.niveau===old) g.niveau=v; });
  S.kits.forEach(k=>k.niveaux=(k.niveaux||[]).map(x=>x===old?v:x)); if(S.programme[old]){ S.programme[v]=S.programme[old]; delete S.programme[old]; } S.niveaux=NIVEAUX; render(); toast('Niveau renommé ✔'); }
function addNiveau(){ const v=(prompt('Nom du nouveau niveau (ex : 4ème Master) :')||'').trim(); if(!v) return; if(NIVEAUX.includes(v)) return toast('Existe déjà'); NIVEAUX.push(v); S.niveaux=NIVEAUX; render(); }
function delNiveau(i){ const n=NIVEAUX[i]; const c=S.eleves.filter(e=>e.niveau===n).length; if(!confirm(`Supprimer le niveau « ${n} » ?`+(c?` (${c} élève(s) passeront à « À préciser »)`:''))) return;
  S.eleves.forEach(e=>{ if(e.niveau===n) e.niveau='À préciser'; }); NIVEAUX.splice(i,1); S.niveaux=NIVEAUX; render(); }
function mvNiveau(i,d){ if(i+d<0) return; [NIVEAUX[i],NIVEAUX[i+d]]=[NIVEAUX[i+d],NIVEAUX[i]]; S.niveaux=NIVEAUX; render(); }
function editGroupe(id, jour){
  const g = id ? grp(id) : {jour:jour||'Samedi', horaire:'09h00-10h30', niveau:'', code:'G'+(S.groupes.filter(x=>x.jour===(jour||'Samedi')).length+1)};
  formModal(id?'Modifier le groupe':'Nouveau groupe', [
    {k:'code',label:'Nom court (ex : G1)'},{k:'jour',label:'Jour',type:'select',options:JOURS},{k:'horaire',label:'Horaire (ex : 14h00-15h30)',req:1,full:1},
    {k:'niveau',label:'Niveau',type:'select',options:[['','— Mixte / à préciser —'],...NIVEAUX]},
    {k:'formateur',label:'Formateur',type:'select',options:[['','— Aucun —'],...S.users.filter(u=>u.role==='formateur').map(u=>[u.id,u.nom])]},
  ], g, fd => { if(id){ Object.assign(g,fd); S.eleves.filter(e=>e.groupe===id).forEach(e=>e.jour=g.jour); } else S.groupes.push({id:uid('g'),...fd}); });
}
function toggleFerie(d){
  const f=ferieOf(d);
  if(f){ if(f.debut===f.fin){ if(confirm(`Annuler « ${f.label} » (${fmtD(d)}) ? Ce jour redevient un jour de cours.`)){ S.feries.splice(S.feries.indexOf(f),1); render(); } }
         else alert(`Ce jour fait partie de « ${f.label} » (${fmtD(f.debut)} → ${fmtD(f.fin)}). Modifiez cette période dans Paramètres → Jours fériés & vacances.`); return; }
  const lab=prompt(`Marquer le ${fmtD(d)} comme jour sans cours.\nMotif (ex : Jour férié, Compétition, Vacances…) :`,'Jour férié'); if(lab===null) return;
  S.feries.push({debut:d, fin:d, label:lab||'Jour férié', type:/vacance/i.test(lab)?'VACANCES':'FÉRIÉ'}); render(); toast('Jour marqué ✔ – les séances suivantes sont décalées');
}
function delGroupe(id){ S.eleves.forEach(e=>{ if(e.extra) e.extra=e.extra.filter(x=>x!==id); }); if(S.eleves.some(e=>e.groupe===id)) return toast('Déplacez d\'abord les élèves de ce groupe'); del('groupes',id,'ce groupe'); }
function editFerie(i){
  const f = i!==undefined ? S.feries[i] : {type:'FÉRIÉ', debut:TODAY, fin:TODAY};
  formModal(i!==undefined?'Modifier':'Nouveau jour férié / vacances', [
    {k:'debut',label:'Du',type:'date',req:1},{k:'fin',label:'Au (inclus)',type:'date',req:1},{k:'label',label:'Libellé',full:1,req:1},{k:'type',label:'Type',type:'select',options:['FÉRIÉ','VACANCES']},
  ], f, fd => { if(fd.fin<fd.debut) fd.fin=fd.debut; if(i!==undefined) Object.assign(f,fd); else S.feries.push(fd); });
}
function addLecon(n,l){ if(!l.trim())return; S.lecons[n].push(l.trim()); render(); }
function delLecon(n,i){ S.lecons[n].splice(i,1); render(); }
function mvLecon(n,i,d){ const a=S.lecons[n]; if(i+d<0)return; [a[i],a[i+d]]=[a[i+d],a[i]]; render(); }
</script>
